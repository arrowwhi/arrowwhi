name: Metrics

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: [".github/workflows/metrics.yml"]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: false

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: Overview
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.base.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: arrowwhi
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Europe/Moscow
          config_display: large
          repositories_forks: yes

      - name: Contribution calendar
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.isocalendar.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: arrowwhi
          base: ""
          config_timezone: Europe/Moscow
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

      - name: Languages
        uses: lowlighter/metrics@latest
        with:
          filename: metrics/metrics.languages.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: arrowwhi
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_threshold: 1%
          plugin_languages_ignored: html, css, makefile, dockerfile, shell, procfile
